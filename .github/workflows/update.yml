name: Daily rebuild

on:
  schedule:
    - cron: "47 10 * * *"   # every day, 6:47am New York (10:47 UTC)
  workflow_dispatch:         # adds a "Run workflow" button for manual updates

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build_data.py
      - run: python build_site.py
      - name: Save the new site
        run: |
          git config user.name "ball-knowledge-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "daily update $(date -u +%F)"
          git push
